<script>
    // ESTADO DE LA APLICACIÓN
    let invoices = JSON.parse(localStorage.getItem('petInvoices')) || [];
    let activeInvoiceId = null;
    let logoBase64 = localStorage.getItem('petLogo') || '';
    let themeColor = localStorage.getItem('petTheme') || '#4f46e5';

    // INICIALIZACIÓN
    window.onload = () => {
        const walkDateInput = document.getElementById('walkDate');
        if (walkDateInput) walkDateInput.valueAsDate = new Date();
        
        if (logoBase64) applyLogo(logoBase64);
        if (themeColor) updateThemeColor(themeColor, false);

        if (invoices.length === 0) {
            createNewInvoice("Natalia Gómez", "Milo");
        } else {
            activeInvoiceId = invoices[0].id;
            renderInvoiceList();
            loadInvoice(activeInvoiceId);
        }
        updateDashboardStats();
    };

    // GUARDAR EN LOCALSTORAGE
    function saveToStorage() {
        localStorage.setItem('petInvoices', JSON.stringify(invoices));
        updateDashboardStats();
    }

    // 1. CREAR NUEVA FACTURA
    function createNewInvoice(defaultClient = 'Nuevo Cliente', defaultPet = 'Mascota') {
        const newId = 'FAC-' + String(Date.now()).slice(-4);
        const todayStr = new Date().toLocaleDateString('es-CO');

        const newInvoice = {
            id: newId,
            number: newId,
            date: todayStr,
            status: 'Pendiente', // 'Pendiente' o 'Pagada'
            discount: 0,
            clientName: defaultClient,
            clientPhone: "3000000000",
            petNames: defaultPet,
            servicePeriod: "Periodo: " + new Date().toLocaleString('es-CO', { month: 'long', year: 'numeric' }),
            walks: [
                { id: Date.now(), date: todayStr, pets: defaultPet, notes: "1 Hora Paseo Individual", price: 15000 }
            ]
        };

        invoices.unshift(newInvoice);
        activeInvoiceId = newInvoice.id;
        saveToStorage();
        renderInvoiceList();
        loadInvoice(activeInvoiceId);
        showToast("Nueva factura creada");
    }

    // 2. DUPLICAR FACTURA
    function duplicateCurrentInvoice() {
        const current = invoices.find(i => i.id === activeInvoiceId);
        if (!current) return;

        const newId = 'FAC-' + String(Date.now()).slice(-4);
        const todayStr = new Date().toLocaleDateString('es-CO');

        const duplicated = JSON.parse(JSON.stringify(current));
        duplicated.id = newId;
        duplicated.number = newId;
        duplicated.date = todayStr;
        duplicated.status = 'Pendiente';

        invoices.unshift(duplicated);
        activeInvoiceId = duplicated.id;
        saveToStorage();
        renderInvoiceList();
        loadInvoice(activeInvoiceId);
        showToast(`Factura duplicada como ${newId}`);
    }

    // 3. RENDERIZAR LISTA DE FACTURAS Y BÚSQUEDA
    function renderInvoiceList(searchTerm = '', statusFilter = 'ALL') {
        const listEl = document.getElementById('invoiceList');
        if (!listEl) return;
        
        listEl.innerHTML = '';

        const filtered = invoices.filter(inv => {
            const matchesSearch = inv.clientName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  inv.number.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesStatus = statusFilter === 'ALL' || inv.status === statusFilter;
            return matchesSearch && matchesStatus;
        });

        document.getElementById('invoiceCount').innerText = filtered.length;

        filtered.forEach(inv => {
            const subtotal = inv.walks.reduce((sum, w) => sum + Number(w.price), 0);
            const total = subtotal - (inv.discount || 0);
            const isActive = inv.id === activeInvoiceId;
            const isPaid = inv.status === 'Pagada';

            const item = document.createElement('div');
            item.className = `p-3 rounded-xl border cursor-pointer transition flex justify-between items-center ${
                isActive ? 'bg-indigo-50 border-indigo-300 shadow-sm' : 'bg-white border-slate-100 hover:bg-slate-50'
            }`;
            item.onclick = () => {
                activeInvoiceId = inv.id;
                renderInvoiceList(searchTerm, statusFilter);
                loadInvoice(inv.id);
            };

            item.innerHTML = `
                <div>
                    <div class="font-bold text-xs text-slate-800">${inv.number} - ${inv.clientName}</div>
                    <div class="text-[11px] text-slate-400">${inv.walks.length} paseos · $${total.toLocaleString('es-CO')}</div>
                </div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                    isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                }">
                    ${inv.status || 'Pendiente'}
                </span>
            `;
            listEl.appendChild(item);
        });
    }

    // 4. CARGAR FACTURA ACTIVA AL DOM
    function loadInvoice(id) {
        const inv = invoices.find(i => i.id === id);
        if (!inv) return;

        const setVal = (elemId, val) => {
            const el = document.getElementById(elemId);
            if (el) el.innerText = val;
        };

        setVal('activeInvoiceName', inv.number);
        setVal('invoiceNumber', inv.number);
        setVal('invoiceDate', inv.date);
        setVal('clientName', inv.clientName);
        setVal('clientPhone', inv.clientPhone || '');
        setVal('petNames', inv.petNames);
        setVal('servicePeriod', inv.servicePeriod || '');

        // Actualizar selector de estado si existe en la UI
        const statusSelect = document.getElementById('invoiceStatusSelect');
        if (statusSelect) statusSelect.value = inv.status || 'Pendiente';

        renderWalksTable(inv.walks);
        calculateInvoiceTotals(inv);
    }

    // 5. CAMBIAR ESTADO DE LA FACTURA (PAGADA / PENDIENTE)
    function toggleInvoiceStatus(newStatus) {
        const inv = invoices.find(i => i.id === activeInvoiceId);
        if (!inv) return;

        inv.status = newStatus;
        saveToStorage();
        renderInvoiceList();
        showToast(`Factura marcada como ${newStatus}`);
    }

    // 6. RENDERIZAR Y CALCULAR TABLA Y TOTALES
    function renderWalksTable(walks) {
        const tbody = document.getElementById('walkItemsTable');
        if (!tbody) return;
        tbody.innerHTML = '';

        walks.forEach((walk, index) => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50/80 transition";
            tr.innerHTML = `
                <td class="p-3 font-medium text-slate-700">${walk.date}</td>
                <td class="p-3 text-slate-600 font-semibold">${walk.pets}</td>
                <td class="p-3 text-slate-500">${walk.notes || 'Paseo Recreativo'}</td>
                <td class="p-3 text-right font-bold text-slate-800">$${Number(walk.price).toLocaleString('es-CO')}</td>
                <td class="p-3 text-center no-print">
                    <button onclick="removeWalk(${index})" class="text-slate-300 hover:text-rose-600 font-bold text-base px-1">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calculateInvoiceTotals(inv) {
        const subtotal = inv.walks.reduce((sum, w) => sum + Number(w.price), 0);
        const discount = Number(inv.discount || 0);
        const total = Math.max(0, subtotal - discount);

        const totalCountEl = document.getElementById('totalCount');
        const totalAmountEl = document.getElementById('totalAmount');

        if (totalCountEl) totalCountEl.innerText = inv.walks.length;
        if (totalAmountEl) totalAmountEl.innerText = '$' + total.toLocaleString('es-CO');
    }

    // 7. AGREGAR PASEO
    function addWalkToInvoice(e) {
        e.preventDefault();
        const inv = invoices.find(i => i.id === activeInvoiceId);
        if (!inv) return;

        const dateVal = document.getElementById('walkDate').value;
        const [year, month, day] = dateVal.split('-');
        const formattedDate = `${day}/${month}/${year}`;

        const newWalk = {
            id: Date.now(),
            date: formattedDate,
            pets: document.getElementById('walkPets').value,
            price: Number(document.getElementById('walkPrice').value),
            notes: document.getElementById('walkNotes').value
        };

        inv.walks.push(newWalk);
        saveToStorage();
        renderWalksTable(inv.walks);
        calculateInvoiceTotals(inv);
        renderInvoiceList();

        document.getElementById('walkPets').value = '';
        document.getElementById('walkNotes').value = '';
        showToast("Paseo agregado a la factura");
    }

    // 8. ELIMINAR PASEO Y FACTURA
    function removeWalk(index) {
        const inv = invoices.find(i => i.id === activeInvoiceId);
        if (!inv) return;
        inv.walks.splice(index, 1);
        saveToStorage();
        renderWalksTable(inv.walks);
        calculateInvoiceTotals(inv);
        renderInvoiceList();
        showToast("Paseo eliminado");
    }

    function deleteCurrentInvoice() {
        if (invoices.length <= 1) {
            alert("Debes mantener al menos una factura en la lista.");
            return;
        }
        if (!confirm("¿Seguro que deseas eliminar esta factura?")) return;

        invoices = invoices.filter(i => i.id !== activeInvoiceId);
        activeInvoiceId = invoices[0].id;
        saveToStorage();
        renderInvoiceList();
        loadInvoice(activeInvoiceId);
        showToast("Factura eliminada");
    }

    // 9. ENVIAR RESUMEN POR WHATSAPP
    function sendWhatsApp() {
        const inv = invoices.find(i => i.id === activeInvoiceId);
        if (!inv) return;

        const total = inv.walks.reduce((sum, w) => sum + Number(w.price), 0) - (inv.discount || 0);
        const cleanPhone = (inv.clientPhone || '').replace(/\D/g, '');

        const text = `¡Hola! 🐾 Te comparto la cuenta de cobro *${inv.number}* de los paseos de *${inv.petNames}*.\n\n` +
                     `🗓️ *Total Paseos:* ${inv.walks.length}\n` +
                     `💰 *Total a Pagar:* $${total.toLocaleString('es-CO')}\n\n` +
                     `¡Muchas gracias por confiar en nuestro servicio!`;

        const url = cleanPhone 
            ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`
            : `https://wa.me/?text=${encodeURIComponent(text)}`;

        window.open(url, '_blank');
    }

    // 10. ESTADÍSTICAS DEL DASHBOARD
    function updateDashboardStats() {
        const totalBilled = invoices.reduce((sum, inv) => {
            return sum + inv.walks.reduce((wSum, w) => wSum + Number(w.price), 0);
        }, 0);

        const totalPaid = invoices
            .filter(i => i.status === 'Pagada')
            .reduce((sum, inv) => sum + inv.walks.reduce((wSum, w) => wSum + Number(w.price), 0), 0);

        const totalPending = totalBilled - totalPaid;

        const billedEl = document.getElementById('statTotalBilled');
        const paidEl = document.getElementById('statTotalPaid');
        const pendingEl = document.getElementById('statTotalPending');

        if (billedEl) billedEl.innerText = '$' + totalBilled.toLocaleString('es-CO');
        if (paidEl) paidEl.innerText = '$' + totalPaid.toLocaleString('es-CO');
        if (pendingEl) pendingEl.innerText = '$' + totalPending.toLocaleString('es-CO');
    }

    // 11. EXPORTAR BÚSQUEDA / DATOS A EXCEL (CSV)
    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,Factura,Cliente,Mascota,Fecha Paseo,Detalle,Precio,Estado\n";

        invoices.forEach(inv => {
            inv.walks.forEach(w => {
                const row = `"${inv.number}","${inv.clientName}","${w.pets}","${w.date}","${w.notes || ''}",${w.price},"${inv.status}"`;
                csvContent += row + "\n";
            });
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `reporte_paseos_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Reporte CSV descargado");
    }

    // MANEJO DE LOGO Y TEMA
    function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            logoBase64 = e.target.result;
            localStorage.setItem('petLogo', logoBase64);
            applyLogo(logoBase64);
            showToast("Logo actualizado");
        };
        reader.readAsDataURL(file);
    }

    function applyLogo(src) {
        const logoImg = document.getElementById('invoiceLogo');
        const placeholder = document.getElementById('logoPlaceholder');
        if (logoImg && placeholder) {
            logoImg.src = src;
            logoImg.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }
    }

    function updateThemeColor(color, save = true) {
        themeColor = color;
        if (save) localStorage.setItem('petTheme', color);
        const header = document.getElementById('tableHeader');
        if (header) header.style.backgroundColor = color;
    }

    // DESCARGAR PDF CORREGIDO PARA MÓVILES
    function downloadPDF() {
        const element = document.getElementById('invoiceCanvas');
        const invNum = document.getElementById('invoiceNumber').innerText.trim() || 'FAC-001';
        const client = document.getElementById('clientName').innerText.trim() || 'Cliente';

        showToast("Generando PDF...", "info");

        const opt = {
            margin:       [8, 8, 8, 8],
            filename:     `Factura_${invNum}_${client.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                scrollX: 0, 
                scrollY: 0,
                windowWidth: element.scrollWidth
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            showToast("PDF descargado correctamente");
        });
    }
</script>
